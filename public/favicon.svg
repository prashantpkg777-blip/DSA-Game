<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" fill="none">
  <defs>
    <linearGradient id="dsa-grad" x1="4" y1="4" x2="60" y2="60" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#0080FF" />
      <stop offset="50%" stop-color="#8B00FF" />
      <stop offset="100%" stop-color="#20B2AA" />
    </linearGradient>
    <linearGradient id="dsa-glow" x1="10" y1="10" x2="54" y2="54" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#20B2AA" stop-opacity="0.8" />
      <stop offset="100%" stop-color="#FF1493" stop-opacity="0.8" />
    </linearGradient>
    <filter id="neon-glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="2.5" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Base Glass Squircle -->
  <rect x="2" y="2" width="60" height="60" rx="16" fill="#080B18" stroke="url(#dsa-grad)" stroke-width="2" />
  <rect x="3" y="3" width="58" height="58" rx="15" fill="rgba(255, 255, 255, 0.05)" />

  <!-- Controller Outline / Gamepad Body -->
  <path d="M16 25C16 20 22 17 32 17C42 17 48 20 48 25C48 35 44 45 40 45C37 45 35 40 32 40C29 40 27 45 24 45C20 45 16 35 16 25Z" 
        fill="rgba(15, 23, 42, 0.7)" 
        stroke="url(#dsa-grad)" 
        stroke-width="2.5" 
        filter="url(#neon-glow)" />

  <!-- DSA Tree/Graph Network Connections on Gamepad -->
  <!-- Left D-Pad cross -->
  <path d="M23 25V33M19 29H27" stroke="#20B2AA" stroke-width="2.5" stroke-linecap="round" />

  <!-- Right Binary Tree Nodes / Action Buttons -->
  <circle cx="39" cy="25" r="2.5" fill="#FF1493" />
  <circle cx="43" cy="29" r="2.5" fill="#8B00FF" />
  <circle cx="35" cy="29" r="2.5" fill="#0080FF" />
  <circle cx="39" cy="33" r="2.5" fill="#20B2AA" />

  <!-- Center Connecting Algorithm Graph Pulse -->
  <path d="M29 27L32 24L35 27" stroke="rgba(255, 255, 255, 0.6)" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" />
</svg>